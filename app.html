['અનુસૂચિ – 2',S=>SCH(S,2,'બાંહેધરીનું ફોર્મ','ફકરો 3(24)',`<p>મેં ગુજરાત સરકારશ્રીના ${RALL} ની જોગવાઈઓ વાંચી છે અને તેમાં જણાવેલી શરતો સાથે સંમત છું.</p><p>હું બાંહેધરી આપું છું કે મને જ્યારે અને જેમ બઢતી મળવાપાત્ર થશે ત્યારે તેનો અસ્વીકાર કરીશ નહીં. કોઈ કારણસર બઢતીનો અસ્વીકાર કરું, તો 9, 20 અને 31 વર્ષે ઉચ્ચતર પગાર ધોરણની યોજના હેઠળ મળતા લાભ જતા કરીશ અને મૂળ નીચલા પગાર ધોરણનો સ્વીકાર કરીશ. જો મને 9, 20, 31 વર્ષે આ યોજનાનો લાભ મળ્યો ન હોય, તો મૂળ નીચલા પગાર ધોરણમાં જે પગાર મળતો હોય તે જ મળવાપાત્ર થશે.</p>`)],
['અનુસૂચિ – 3',S=>SCH(S,3,'વિકલ્પનું ફોર્મ','ફકરો 3(25)',`<p>(1) મને નાણાં વિભાગના તા.18/02/2011 ના ઠરાવ ક્રમાંક પગર/1009/56/પ.એ.(મ) હેઠળ અમલમાં આવેલ સિનિયર-સિલેક્શન પગાર ધોરણનો લાભ આપવામાં આવ્યો છે. હવેથી સિનિયર-સિલેક્શન પગાર ધોરણને બદલે, નાણાં વિભાગના ${R1}, ઠરાવ ક્રમાંક 1194-48-મ તા.18/02/2011 તથા ${R5} અન્વયે દાખલ કરેલ યોજના હેઠળ તા.01/06/1987 થી સુધારેલ ઉચ્ચતર પગાર ધોરણ રદ કરવાનો વિકલ્પ હું આપું છું. સિનિયર-સિલેક્શન પગાર મંજૂર થવાથી મને થયેલ વધારાની રકમ અથવા પગાર-ભથ્થાના તફાવતની રકમ નીકળતી હોય, તો તે “સુધારેલ પગાર ધોરણ યોજના” હેઠળ મળવાપાત્ર લાભ સામે સરભર કરવી અથવા સરકારમાં ચાલતી પદ્ધતિ મુજબ રાબેતા પ્રમાણે વસૂલ કરવી.</p><p>(2) આથી આપેલ આ વિકલ્પ આખરી છે અને હવે પછીની કોઈ પણ તારીખે તેમાં ફેરફાર કરી શકાશે નહીં.</p>`)],

<p style="font-size:12px;margin-top:6mm"><b>નોંધ:</b> પ્રતિનિયુક્તિ ઉપરના કર્મચારીનો પેન્શન કેસ તેના મુળ ખાતા/કચેરી મારફતે મોકલવાનો રહે છે.<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;રાજ્ય સરકાર ગ્રાન્ટ ઈન એઈડ શાળા કોલેજના કર્મચારીઓના કેસ ડીપીપીએફ ને મોકલવાના રહેશે.<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;પંચાયત સંવર્ગના કર્મચારીઓના કેસ જિલ્લા સહાયક નિરીક્ષકશ્રીને મોકલવાના રહેશે.</p>`},1],

['ભાગ-૧ – કુટુંબની વિગતો [૩]',S=>{const p=S.p,rows=[...p.fam];while(rows.length<5)rows.push(null);return `<p>૯ &nbsp;&nbsp;જે જિલ્લા/ પેટા તિજોરીએથી પેન્શન મેળવવા માગતા હોય તેનું નામ : ${VV(p.tres)}<br><span style="margin-left:6mm"></span>${VV('જિલ્લો : '+S.dist)}</p>
<p>૧૦ &nbsp;હું મારા મળવાપાત્ર પેન્શનના ${VV(g(p.cp)+'% ('+p.cpw+') ટકા')} ભાગનું મૂડીકૃત રૂપાંતરની કિંમત આપવા આજ તારીખ ${VV(S.rdate)} ના રોજ વિનંતી કરુ છું.<br><b>નોંધ</b> પેન્શનના રૂપાંતર માટેની અરજી નિવૃતિની તારીખ પછીના ૧૨ માસ પછી કરવામાં આવે તો મેડીકલ બોર્ડના પ્રમાણપત્ર સાથે ફોર્મ -૧૬ માં અરજી સામેલ કરવાની રહેશે.</p>
<p>૧૧ &nbsp;કુટુંબની વિગતોઃ ગુ.મુ. સેવા પેન્શન ના નિયમો - ૨૦૦૨ ના નિયમ ૮૯ મુજબ<br><b>તારીખ .</b> &nbsp;${VV(S.rdate)} &nbsp;&nbsp;&nbsp;ના દિવસે મારા કુટુંબના સભ્યોની વિગતો નીચે પ્રમાણે છે.</p>

<p>હું બાંહેધરી પૂર્વક જાહેર કરુ છું કે, મારા કુટુંબની વિગતો આજની તારીખે ઉપર મુજબ છે. તેમાં કોઈપણ ફેરફાર થશે તો કચેરીના અથવા ખાતાના વડાને તેની જાણ કરીશ.</p>
<p>૧૨ &nbsp;&nbsp;સરકારશ્રીના નાણાં વિભાગનાં તા.૨૩-૦૬-૨૦૦૦ના ઠરાવ ક્રમાંકઃડીપીપી/૧૦૯૯/૪૯૬/૯૪૫(૪) P મુજબ નિયત નમુનામાં વારસ નિયુક્તિ ફોર્મની પ્રમાણીત નકલ આ સાથે સામેલ રાખુ છું.</p>
<p>૧૩ &nbsp;&nbsp;મારા પુત્ર/પુત્રી શ્રી/કુમારી ${ln(80)}અંધ/ અપંગ / મંદબુધ્ધિના છે. તેને લગતુ સિવીલ સર્જનનું દાકતરી પ્રમાણપત્ર સામેલ રાખેલ છે. તેઓ જીવન નિર્વાહ પુરતું કમાવવા માટે અશક્તિમાન છે. તેમને કુટુંબ પેન્શન ચુકવવાનો પ્રસંગ ઉપસ્થિત થાય ત્યારે તેમના વાલી તરીકે શ્રી/શ્રીમતિ ${ln(80)}ને ફરજ બજાવવા નીમું છું. ગુ.મુ.સેવા પેન્શનના નિયમો -૨૦૦૨ ના નિયમ ૯૩ મુજબ.</p>
<p>૧૪ &nbsp;&nbsp;ઉપર જણાવેલ વિગતોમાં ફેરફાર કે સુધારા વધારા થાય તેવા પ્રસંગે પેન્શન અને પ્રોવિડન્ટ નિયામકશ્રી કે કચેરીના વડા તેમજ સબંધ કર્તાને જાણ કરી અદ્યતન રાખવાની બાંહેધરી આપુ છું.<br>ઉપરની વિગતો મારી કચેરીના વડા સમક્ષ આજ તા. &nbsp;${VV(S.rdate)} &nbsp;ના રોજ ઉપસ્થિત થઈ પેન્શનની કાર્યવાહી અર્થે આપું છું. (કર્મચારીની માંદગી પ્રસંગે કે બહાર ગામ ગયા હોય તેવા પ્રસંગે પ્રતિનિધી અથવા ટપાલ મારફતે ઉપરની વિગતો મોક્લી આપી શકાશે. )</p>

['ભાગ-૧ – વારસ નિયુક્તિ / બાંહેધરી [૪]',S=>{const p=S.p;return `<p><b>૧૫ વારસ નિયુક્તિ</b></p>

<ol class="cpf" style="font-size:12px"><li>સી.પી.એફ. યોજનામાં જોડાયા તારીખ</li><li>સી.પી.એફ. ખાતા નંબર</li><li>કર્મચારીનો વ્યક્તિગત ફાળો વ્યાજ સહિત</li><li>સંસ્થાનો ફાળો વ્યાજ સહિત</li><li>સરકારી ફાળા વ્યાજ સહિત જો ચુકવ્યા હોય તો</li><li>કુલ : ૩ + ૪ + ૫</li><li>આ પત્રકમાં જે તારીખ સુધીનું બેલેન્સ પોસ્ટની પાસબુક પ્રમાણે લીધું હોય તે તારીખ</li><li>કર્મચારીના હિસાબમાં ઉપરોક્ત ક્રમ ૭ પ્રમાણેની કુલ સિલક</li><li>ઉપરોક્ત અનુક્રમ નંબર ૮ પૈકી કર્મચારીને પોતાનો વ્યક્તિગત ફાળો, ડિપોઝીટ, સેવિંગ સર્ટીફીકેટ વગેરેની પોતાના અંગત રોકાણની રકમ</li><li>ઉપરોક્ત અનુક્રમ નંબર ૯ પૈકી કર્મચારીએ પેન્શન યોજના સ્વીકારી હોવાથી સી.પી.એફ. નો વ્યાજ સહિતનો સદર જે ફાળો સરકારમાં ............................... સદરે જમા કરાવવાનો થતો હોય તે રકમ</li></ol>
<p style="font-size:12px;margin-top:4mm"><b>નોંધ:</b><br>સી.પી.એફ. સંસ્થાનો વ્યાજ સહિત સઘળો ફાળો સરકારી તિજોરીમાં ............................ સદરે તે ફાળો તિજોરીમાં જે તારીખે જમા કરાવ્યો હોય તે તારીખ સુધીના વ્યાજનો સમાવેશ થયેલ નહી હોય તેથી ઉપરોક્ત અ.નં. ૯ પ્રમાણે સી.પી.એફ. નો ફાળો જે તારીખના બેલન્સ સાથે ગણતરીમાં લીધો હોય તે તારીખનો ને વર્ષના માચે સુધીના સમયનું જે તે તારીખે જમા કરાવ્યો હોય તે તારીખ સુધીના વ્યાજના જમા કરાવેલ રકમમાં સમાવેશ થયો નહી હોય માટે તેટલા સમયનું પોસ્ટના ધોરણે વ્યાજ જમા કરાવવાનું થશે તેથી તે વ્યાજની ગણતરી કરીને તેનું પેન્શન, ગ્રેજ્યુઇટીમાંથી જે રકમની વસુલાત કરવાની થાય તેનું પત્રક બનાવીને પેન્શન પેપર્સ સાથે સામેલ કરીને વસુલાતની રકમ જણાવવી અથવા તે રકમ .................. સદરે જમા કરાવીને અસલ ચલણ પેન્શન પેપર્સ સાથે સામેલ કરવું.</p>

  if(p!==$g('lp2').value){e.textContent='પાસવર્ડ મેળ ખાતા નથી.';return}USERS[u]={h:hp(u,p),r:'a'};svU()}
 else{const x=USERS[u];if(!x||x.h!==hp(u,p)){e.textContent='યુઝર નામ અથવા પાસવર્ડ ખોટો છે.';return}}
 CUR=u;LS.set(SK,u);enter();autoSave()}
function enter(){const o=$g('lg');if(o)o.remove();unlocked=isAdm();lockUI()}
function logout(){LS.set(SK,'');CUR='';unlocked=false;lockUI();gate()}
function lockUI(){SCHK.forEach(k=>{const e=$g(k);if(e){const d=!unlocked||LKF.includes(k);e.disabled=d;e.style.background=d?'#eef1f5':''}});
 const b=$g('admbox');if(!b)return;
 const sv='<div style="margin-top:8px"><button onclick="saveNow()">💾 ડેટા સેવ</button> '+(unlocked?'<label style="display:inline-block;background:#777;color:#fff;border-radius:6px;padding:7px 13px;margin:0">📂 રીસ્ટોર<input type="file" accept=".json" style="display:none" onchange="restoreFile(this)"></label>':'')+'<div class="hint" id="svst">ઓટો-સેવ ચાલુ: Documents/'+FD+'</div></div>';
 b.innerHTML=unlocked
  ?`<b>🔓 એડમિન: ${esc(CUR)}</b> – આચાર્ય/મોબાઇલ વગેરે બદલી શકાય છે (શાળા, સંચાલક મંડળ, તાલુકો, જિલ્લો, સ્થળ લોક છે).<div style="margin-top:8px"><b>👥 એક્સેસ આપેલા યુઝર</b>${Object.keys(USERS).filter(k=>USERS[k].r!=='a').map(k=>`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dde;padding:3px 0">${esc(k)}<span><button style="background:#0e7c86;padding:3px 8px" onclick="uPass('${encodeURIComponent(k)}')">🔑</button> <button style="background:#b00020;padding:3px 8px" onclick="uDel('${encodeURIComponent(k)}')">🗑</button></span></div>`).join('')||'<div class="hint">હજી કોઈ યુઝર નથી.</div>'}<label>નવો યુઝર – નામ</label><input id="nu" autocomplete="off"><label>પાસવર્ડ</label><input id="np"><button style="margin-top:6px" onclick="uAdd()">➕ એક્સેસ આપો</button></div>${sv}<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button style="background:#777" onclick="uPass('${encodeURIComponent(CUR)}')">મારો પાસવર્ડ બદલો</button><button onclick="logout()">🚪 લોગઆઉટ</button></div>`
  :`<b>👤 ${esc(CUR)}</b> – શાળાની માહિતી ફક્ત એડમિન બદલી શકે; શાળા, સંચાલક મંડળ, તાલુકો, જિલ્લો, સ્થળ કોઈ બદલી શકતું નથી.${sv}<div style="margin-top:8px"><button onclick="logout()">🚪 લોગઆઉટ</button></div>`}
function uAdd(){const u=$g('nu').value.trim().toLowerCase(),p=$g('np').value;if(u.length<2||p.length<4){alert('નામ ઓછામાં ઓછું 2 અને પાસવર્ડ 4 અક્ષરનો રાખો.');return}if(USERS[u]){alert('આ નામનો યુઝર પહેલેથી છે.');return}USERS[u]={h:hp(u,p),r:'u'};svU();lockUI();autoSave();toast('✅ '+u+' ને એક્સેસ મળ્યો – નામ અને પાસવર્ડ તેમને આપો.',4000)}
function uDel(k){k=decodeURIComponent(k);if(!confirm(k+' નો એક્સેસ કાઢી નાખવો?'))return;delete USERS[k];svU();lockUI();autoSave()}
function uPass(k){k=decodeURIComponent(k);const p=prompt(k+' માટે નવો પાસવર્ડ (ઓછામાં ઓછા 4 અક્ષર):');if(p===null)return;if(p.length<4){alert('પાસવર્ડ ખૂબ ટૂંકો છે.');return}USERS[k].h=hp(k,p);svU();autoSave();toast('✅ પાસવર્ડ બદલાયો.',3000)}
function resetApp(){if(!isAdm()){alert('ફક્ત એડમિન ફરી શરૂ કરી શકે.');return}
 if(!confirm('બધો ડેટા નમૂના ડેટામાં ફરી સેટ થશે (શાળાની માહિતી અને યુઝર રહેશે). ચાલુ રાખવું?'))return;
 let v={};try{v=JSON.parse(LS.get('uph4')||'{}')}catch(e){}const k={};SCHK.forEach(x=>{if(v[x]!==undefined)k[x]=v[x]});LS.set('uph4',JSON.stringify(k));try{localStorage.removeItem('emps4')}catch(e){}location.reload()}
/* ---- ઓટો ફોલ્ડર: Documents/Uchchta (એપમાં) ; બ્રાઉઝરમાં સેવ = ડાઉનલોડ ---- */
const FS=()=>{const c=window.Capacitor;return c&&c.isNativePlatform&&c.isNativePlatform()&&c.Plugins&&c.Plugins.Filesystem};
const DN={DOCUMENTS:'Documents',EXTERNAL:'Android/data/(એપ)/files',DATA:'એપનો આંતરિક ફોલ્ડર'};
async function fsw(n,t){const f=FS();if(!f)return null;try{await f.requestPermissions()}catch(e){}
 for(const d of['DOCUMENTS','EXTERNAL','DATA']){try{await f.writeFile({path:FD+'/'+n,data:t,directory:d,encoding:'utf8',recursive:true});return d}catch(e){}}return null}
const pack=()=>JSON.stringify({v:1,t:new Date().toISOString(),uph4:LS.get('uph4'),emps4:LS.get('emps4'),users:LS.get(UK)});
function stat(d){const e=$g('svst');if(e&&d)e.textContent='✅ છેલ્લે સેવ '+new Date().toLocaleTimeString('gu-IN',{hour:'2-digit',minute:'2-digit'})+' → '+DN[d]+'/'+FD}
async function autoSave(){if(!CUR||!FS())return;stat(await fsw('Uchchta_data.json',pack()))}
async function saveNow(){try{readEmps();calc()}catch(e){}const t=pack(),d=new Date(),z=x=>String(x).padStart(2,'0'),n='Uchchta_'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+'.json';
 if(FS()){const r=await fsw(n,t);await fsw('Uchchta_data.json',t);if(r){stat(r);toast('✅ સેવ થયું: '+DN[r]+'/'+FD+'/'+n,6000)}else toast('⚠ સેવ ન થયું – સ્ટોરેજ પરવાનગી આપો.',6000)}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('✅ ફાઇલ ડાઉનલોડ થઈ: '+n,5000)}}
function applyBk(j){if(j.uph4)LS.set('uph4',j.uph4);if(j.emps4)LS.set('emps4',j.emps4);if(j.users)LS.set(UK,j.users)}
function restoreFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.uph4&&!j.emps4)throw 0;if(!confirm('આ ફાઇલનો ડેટા હાલના ડેટા પર આવી જશે. ચાલુ રાખવું?'))return;applyBk(j);location.reload()}catch(e){alert('આ સાચી સેવ ફાઇલ નથી.')}};r.readAsText(f)}
async function tryRestore(){const f=FS();if(!f||Object.keys(USERS).length)return;
 for(const d of['DOCUMENTS','EXTERNAL','DATA']){try{const r=await f.readFile({path:FD+'/Uchchta_data.json',directory:d,encoding:'utf8'}),j=JSON.parse(r.data);if(j.users){applyBk(j);location.reload();return}}catch(e){}}}
(()=>{let t;const q=()=>{clearTimeout(t);t=setTimeout(autoSave,1500)};document.addEventListener('input',q);document.addEventListener('change',q);document.addEventListener('visibilitychange',()=>{if(document.hidden)autoSave()})})();
document.body.insertAdjacentHTML('beforeend','<button class="noprint" onclick="saveNow()" style="position:fixed;right:10px;bottom:68px;z-index:8;border-radius:22px;box-shadow:0 2px 8px #0004;background:#c9971c">💾 સેવ</button>');
async function chkUpd(){const u=LICD&&LICD.upd;if(!window.__ldr||!u||!navigator.onLine)return;
 try{const b=u.replace(/\/?$/,'/'),j=await (await fetch(b+'version.json?'+Date.now(),{cache:'no-store'})).json();if(!(j.v>BUILD_V))return;
  toast('🔔 એપની નવી આવૃત્તિ મળી'+(j.note?': '+j.note:''),0,'⬇ અપડેટ કરો',()=>doUpd(b,j))}catch(e){}}
async function doUpd(b,j){toast('અપડેટ ડાઉનલોડ થાય છે…',0);
 try{const h=await (await fetch(b+'app.html?'+Date.now(),{cache:'no-store'})).text(),m=/BUILD_V=(\d+)/.exec(h);if(!m||+m[1]!==j.v||h.indexOf('</html>')<0)throw 0;
  try{await autoSave()}catch(e){}LS.set('uph_ota',JSON.stringify({v:j.v,h}));location.reload()}catch(e){toast('⚠ અપડેટ ન થયું – ઇન્ટરનેટ તપાસો.',5000)}}
function boot2(){setTimeout(chkUpd,3000);if(USERS[CUR])enter();else{CUR='';gate();tryRestore()}if(LICD){LKF.forEach(k=>{const e=$g(k);if(e)e.value=LICD[k]||''});try{calc()}catch(x){}lockUI()}}
if(licOK())boot2();else licGate()
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
